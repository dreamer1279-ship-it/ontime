<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 카드 놀이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
:root{--bg:#FFF8EC;--ink:#1F2A44;--blue:#3B82F6;--ok:#22C55E;--bad:#EF4444;--line:#E4D9C3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 20px/1.5 'Noto Sans KR',sans-serif}
button,input{font:inherit;color:inherit}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:2px solid var(--line);flex-wrap:wrap}
h1{margin:0;font-size:26px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:#fff;border-radius:14px;padding:10px 18px;cursor:pointer;font-weight:700}
.btn.on{background:var(--ink);color:#fff}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff;font-size:22px;padding:14px 28px}
main{max-width:1000px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs .btn{font-size:22px;padding:12px 20px}
.hint{font-size:22px;margin:0 0 16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid.sentences{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{min-height:96px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;font-weight:700;text-align:center}
.card.en{font:800 36px/1.25 Nunito,'Noto Sans KR',sans-serif}
.card.ko{font-size:32px}
.sentences .card.en{font-size:26px}.sentences .card.ko{font-size:24px}
.card.sel{border-color:var(--blue);background:#E8F1FF;transform:scale(1.03)}
.card.done{border-color:var(--ok);background:#DCFCE7;cursor:default}
.card.done::before{content:"✓ ";color:#15803D}
.card.wrong{border-color:var(--bad);background:#FEE2E2;animation:shake .4s}
.card.wrong::before{content:"✗ ";color:var(--bad)}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.big{font-size:44px;font-weight:800;text-align:center;margin:24px 0}
.center{text-align:center}
input{width:100%;border:3px solid var(--ink);border-radius:16px;padding:14px 18px;font-size:34px;font-family:Nunito,sans-serif;font-weight:800;text-align:center;background:#fff;margin-bottom:14px}
.t input{font-size:20px;text-align:left;font-family:inherit;font-weight:500;padding:10px 14px;margin-bottom:8px}
#fb{font-size:32px;font-weight:800;margin:16px 0;min-height:48px;text-align:center}
.good{color:#15803D}.no{color:var(--bad)}
.slots{display:flex;gap:10px;flex-wrap:wrap;min-height:72px;padding:12px;background:#fff;border:3px dashed var(--line);border-radius:18px;margin-bottom:18px;justify-content:center}
.chip{font:800 32px Nunito,sans-serif;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 18px;cursor:pointer}
.slots .chip{background:#E8F1FF;border-color:var(--blue)}
.pool{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.chip.used{visibility:hidden}
.panel{background:#fff;border:3px solid var(--line);border-radius:20px;padding:20px;margin-bottom:20px}
.cols{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
h2{margin:0 0 12px;font-size:24px}
ul{list-style:none;padding:0;margin:12px 0 0}
li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
li span{flex:1;word-break:break-word}
li .btn{padding:4px 12px;font-size:16px}
.hide{display:none}
.pr{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:8px;margin-bottom:8px}
.pr input{margin:0}.pr select{font:inherit;font-size:20px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.t input[type=file]{font-size:18px;padding:10px;border-style:dashed;text-align:left}
@media(max-width:700px){.pr{grid-template-columns:1fr}}
.result{text-align:center;padding:30px}
.result b{font-size:48px;display:block;margin:10px 0}
.wordrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 28px}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:76px;padding:0 6px;font:800 48px Nunito,sans-serif;border-bottom:5px solid var(--ink)}
.box.blank{background:#fff;border:3px dashed var(--line);border-radius:12px}
.box.blank.cur{border-color:var(--blue);background:#E8F1FF}
.box.fill{color:#15803D;border-bottom-color:var(--ok)}
.tile{font:800 40px Nunito,sans-serif;min-width:76px;height:84px;background:#fff;border:3px solid var(--ink);border-radius:16px;cursor:pointer}
.tile.used{visibility:hidden}
.tile.wrong{border-color:var(--bad);background:#FEE2E2;animation:shake .4s}
</style>
</head>
<body>
<header>
  <h1>🎓 영어 카드 놀이</h1>
  <div class="row">
    <button class="btn" id="snd" aria-label="소리 켜기/끄기">🔊 소리 켬</button>
    <button class="btn on" id="mS">학생</button>
    <button class="btn" id="mT">교사</button>
  </div>
</header>
<main>
  <section id="student">
    <div class="tabs" id="tabs"></div>
    <div id="stage"></div>
  </section>
  <section id="teacher" class="hide t">
    <div class="panel"><h2>PDF로 자동 입력</h2>
      <p style="margin:0 0 10px">글자가 들어 있는 PDF만 읽을 수 있습니다(스캔본·이미지 불가). 왼쪽 열은 영어, 오른쪽 열은 뜻인 표를 올려 주세요.</p>
      <input type="file" id="pdf" accept="application/pdf"><div id="pv"></div></div>
    <div class="cols">
      <div class="panel"><h2>단어 입력</h2>
        <input id="wEn" placeholder="영어 (예: apple)"><input id="wKo" placeholder="뜻 (예: 사과)">
        <button class="btn on" data-add="words">추가</button><ul id="wList"></ul></div>
      <div class="panel"><h2>문장 입력</h2>
        <input id="sEn" placeholder="영어 문장 (예: I go to school.)"><input id="sKo" placeholder="해석 (예: 나는 학교에 간다.)">
        <button class="btn on" data-add="sentences">추가</button><ul id="sList"></ul></div>
    </div>
    <div class="center"><button class="btn main" id="save">💾 저장하기</button><p id="saveMsg" class="hint"></p></div>
    <div class="panel center"><h2>백업 · 옮기기</h2>
      <div class="row" style="justify-content:center"><button class="btn" id="exp">⬇ 내보내기</button><label class="btn" for="imp">⬆ 불러오기</label><input type="file" id="imp" accept=".json,application/json" class="hide"></div>
      <p style="margin:12px 0 0">내보내기는 위 목록 전체를 파일로 저장합니다. 불러오기는 파일 내용을 목록에 더한 뒤 [저장하기]를 눌러야 반영됩니다.</p></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='english-cards-v1';
let D={words:[],sentences:[]};
try{D=JSON.parse(localStorage.getItem(KEY))||D}catch(e){}
let T=JSON.parse(JSON.stringify(D));
let mute=false,AC;

/* 소리 */
function tone(f,at,d,type='sine',v=0.9){
  if(mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}
const ok=()=>{tone(880,0,.2);tone(1320,.15,.4)};
const bad=()=>{tone(200,0,.5,'sawtooth');tone(150,.12,.5,'square')};
const win=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.14,.35));
$('#snd').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇 소리 끔':'🔊 소리 켬'};

/* 모드 전환 */
function mode(t){
  $('#student').classList.toggle('hide',t);$('#teacher').classList.toggle('hide',!t);
  $('#mT').classList.toggle('on',t);$('#mS').classList.toggle('on',!t);
  if(!t)tab(cur);
}
$('#mT').onclick=()=>mode(true);$('#mS').onclick=()=>mode(false);

/* 교사 화면 */
const F={words:['wEn','wKo','wList'],sentences:['sEn','sKo','sList']};
function tView(){
  for(const k in F){
    const [a,b,l]=F[k];
    $('#'+l).innerHTML=T[k].map((x,i)=>`<li><span><b>${esc(x.en)}</b> ${esc(x.ko)}</span><button class="btn" data-ed="${k}:${i}">수정</button><button class="btn" data-del="${k}:${i}">삭제</button></li>`).join('')||'<li><span>아직 없습니다. 위에서 추가하세요.</span></li>';
  }
}
function add(k){
  const [a,b]=F[k],en=$('#'+a).value.trim(),ko=$('#'+b).value.trim();
  if(!en||!ko){$('#saveMsg').textContent='영어와 뜻을 모두 입력해 주세요.';return}
  T[k].push({en,ko});$('#'+a).value=$('#'+b).value='';$('#'+a).focus();
  $('#saveMsg').textContent='아직 저장되지 않았습니다. [저장하기]를 눌러 주세요.';tView();
}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
Object.keys(F).forEach(k=>[F[k][0],F[k][1]].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')add(k)})));
$('#teacher').addEventListener('click',e=>{
  const d=e.target.dataset;
  if(d.del){const[k,i]=d.del.split(':');T[k].splice(+i,1);$('#saveMsg').textContent='아직 저장되지 않았습니다. [저장하기]를 눌러 주세요.';tView()}
  if(d.ed){const[k,i]=d.ed.split(':'),x=T[k].splice(+i,1)[0];$('#'+F[k][0]).value=x.en;$('#'+F[k][1]).value=x.ko;tView()}
});
$('#save').onclick=()=>{
  D=JSON.parse(JSON.stringify(T));
  try{localStorage.setItem(KEY,JSON.stringify(D));$('#saveMsg').textContent=`저장했습니다. 단어 ${D.words.length}개, 문장 ${D.sentences.length}개`}
  catch(e){$('#saveMsg').textContent='브라우저 저장이 막혀 있어 이 화면을 닫기 전까지만 유지됩니다.'}
  ok();
};

/* 학생 탭 */
const TABS=[['단어 매칭',()=>match('words')],['단어 쓰기',write],['문장 매칭',()=>match('sentences')],['문장 어순',order]];
let cur=0;
function tab(i){
  cur=i;
  $('#tabs').innerHTML=TABS.map((t,k)=>`<button class="btn ${k==i?'on':''}" data-t="${k}">${t[0]}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>tab(+b.dataset.t));
  TABS[i][1]();
}
const empty=(n=1)=>$('#stage').innerHTML=`<div class="panel center"><p class="hint">${n>1?'매칭에는 2개 이상 필요합니다.':'등록된 내용이 없습니다.'} 교사 화면에서 입력하고 저장해 주세요.</p></div>`;
function result(score,total,again){
  win();
  $('#stage').innerHTML=`<div class="panel result">🎉 참 잘했어요!<b>${score} / ${total}</b><button class="btn main" id="again">다시 하기</button></div>`;
  $('#again').onclick=again;
}

/* 1,3. 매칭 */
function match(kind,round=0){
  const L=D[kind],N=kind==='words'?6:4,items=L.slice(round*N,round*N+N),st=$('#stage');
  if(L.length<2)return empty(2);
  const cards=shuffle(items.flatMap((x,i)=>[{i,t:x.en,en:1},{i,t:x.ko,en:0}]));
  let sel=null,found=0,tries=0,lock=false;const t0=Date.now();
  st.innerHTML=`<p class="hint">짝을 찾아보세요! 맞춘 개수 <b id="cnt">0</b> / ${items.length}</p><div class="grid ${kind}">`+
    cards.map(c=>`<button class="card ${c.en?'en':'ko'}">${esc(c.t)}</button>`).join('')+'</div>';
  const els=[...st.querySelectorAll('.card')];
  els.forEach((el,k)=>el.onclick=()=>{
    if(lock||el.classList.contains('done'))return;
    if(sel===null){sel=k;el.classList.add('sel');return}
    if(sel===k){el.classList.remove('sel');sel=null;return}
    const a=cards[sel],b=cards[k],ea=els[sel];
    if(a.en===b.en){ea.classList.remove('sel');sel=k;el.classList.add('sel');return}
    tries++;
    if(a.i===b.i){
      ok();[ea,el].forEach(e=>{e.classList.remove('sel');e.classList.add('done')});sel=null;
      $('#cnt').textContent=++found;
      if(found===items.length)setTimeout(()=>{
        win();const more=(round+1)*N<L.length,sec=Math.round((Date.now()-t0)/1000);
        st.innerHTML=`<div class="panel result">🎉 모두 맞혔어요!<b>${tries}번 만에, ${sec}초</b><button class="btn main" id="nx">${more?'다음 판':'처음부터 다시'}</button></div>`;
        $('#nx').onclick=()=>match(kind,more?round+1:0);
      },700);
    }else{
      bad();lock=true;[ea,el].forEach(e=>e.classList.add('wrong'));
      setTimeout(()=>{[ea,el].forEach(e=>e.classList.remove('wrong','sel'));sel=null;lock=false},700);
    }
  });
}

/* 2. 단어 쓰기 (빈칸 알파벳 클릭) */
const CONF={a:'oeu',b:'dpq',c:'eos',d:'bpq',e:'cao',f:'tl',g:'qyj',h:'nb',i:'lj',j:'gi',k:'hx',l:'it',m:'nw',n:'mhr',o:'ace',p:'qbd',q:'pgd',r:'nm',s:'zc',t:'fl',u:'vn',v:'uy',w:'vm',x:'kz',y:'vg',z:'sx'};
function write(){
  const L=shuffle(D.words);if(!L.length)return empty();
  let n=0,score=0;
  const show=()=>{
    document.onkeydown=null;
    if(n>=L.length)return result(score,L.length,write);
    const chars=[...L[n].en.trim()],isL=c=>/[a-z]/i.test(c);
    const idx=chars.map((c,i)=>isL(c)?i:-1).filter(i=>i>=0);
    if(!idx.length){n++;return show()}
    const blanks=shuffle(idx).slice(0,Math.max(1,Math.round(idx.length/2))).sort((x,y)=>x-y);
    const need=blanks.map(i=>chars[i].toLowerCase());
    const pool=shuffle([...new Set(chars.filter(isL).flatMap(c=>[...CONF[c.toLowerCase()]]))]).filter(c=>!need.includes(c));
    const dis=[];
    while(dis.length<3){
      const c=pool.shift()||String.fromCharCode(97+(Math.random()*26|0));
      if(!need.includes(c)&&!dis.includes(c))dis.push(c);
    }
    const tiles=shuffle([...need,...dis].map((c,k)=>({c,k,used:false})));
    let pos=0,miss=0,done=false;
    const draw=()=>{
      const slots=chars.map((c,i)=>{
        if(c===' ')return '<span style="width:24px"></span>';
        const bl=blanks.indexOf(i);
        if(bl<0)return `<span class="box">${esc(c)}</span>`;
        return bl<pos?`<span class="box fill">${esc(c)}</span>`:`<span class="box blank ${bl===pos?'cur':''}"></span>`;
      }).join('');
      $('#stage').innerHTML=`<p class="hint">${n+1} / ${L.length} · 뜻에 맞게 빈칸을 채우세요</p><div class="big">${esc(L[n].ko)}</div><div class="wordrow">${slots}</div><div class="pool">${tiles.map(t=>`<button class="tile ${t.used?'used':''}" data-k="${t.k}">${t.c}</button>`).join('')}</div><div id="fb"></div><div class="center"><button class="btn main hide" id="nx">${n+1>=L.length?'결과 보기':'다음'}</button></div>`;
      $('#stage').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
        if(done)return;
        const t=tiles.find(x=>x.k==b.dataset.k);if(t.used)return;
        if(t.c===need[pos]){
          ok();t.used=true;pos++;
          if(pos===blanks.length){done=true;if(!miss)score++}
          draw();
          if(done){
            $('#fb').innerHTML=miss?`<span class="no">완성! (틀린 횟수 ${miss}번)</span>`:'<span class="good">✓ 정답!</span>';
            const go=()=>{n++;show()};
            $('#nx').classList.remove('hide');$('#nx').onclick=go;
            document.onkeydown=e=>{if(e.key==='Enter')go()};
          }
        }else{
          bad();miss++;b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),450);
          $('#fb').innerHTML='<span class="no">✗ 다시 골라 보세요</span>';
        }
      });
    };
    draw();
  };
  show();
}

/* 4. 문장 어순 */
function order(){
  const L=shuffle(D.sentences);if(!L.length)return empty();
  let n=0,score=0;
  const show=()=>{
    document.onkeydown=null;
    if(n>=L.length)return result(score,L.length,order);
    const tok=L[n].en.trim().split(/\s+/),pool=shuffle(tok.map((t,i)=>({t,i})));
    let picked=[],done=false;
    const draw=()=>{
      $('#stage').innerHTML=`<p class="hint">${n+1} / ${L.length} · 순서대로 눌러 문장을 만드세요</p><div class="big" style="font-size:34px">${esc(L[n].ko)}</div>
      <div class="slots">${picked.map((p,k)=>`<button class="chip" data-p="${k}">${esc(p.t)}</button>`).join('')||'<span style="color:#8a8fa0">여기에 문장이 만들어집니다</span>'}</div>
      <div class="pool">${pool.map(p=>`<button class="chip ${picked.includes(p)?'used':''}" data-i="${p.i}">${esc(p.t)}</button>`).join('')}</div>
      <div class="center row" style="justify-content:center"><button class="btn" id="undo">되돌리기</button><button class="btn" id="reset">다시 하기</button><button class="btn on hide" id="nx">다음</button></div><div id="fb"></div>`;
      if(done)return;
      $('#undo').onclick=()=>{picked.pop();draw()};
      $('#reset').onclick=()=>{picked=[];draw()};
      $('#stage').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
        const p=pool.find(x=>x.i==b.dataset.i);if(picked.includes(p))return;
        picked.push(p);
        if(picked.length<tok.length)return draw();
        done=true;draw();
        const right=picked.map(x=>x.t).join(' ').toLowerCase()===tok.join(' ').toLowerCase();
        $('#nx').classList.remove('hide');
        if(right){score++;ok();$('#fb').innerHTML='<span class="good">✓ 정답!</span>'}
        else{bad();$('#fb').innerHTML=`<span class="no">✗ 정답: ${esc(L[n].en)}</span>`}
        $('#nx').onclick=()=>{n++;show()};
      });
      $('#stage').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.p,1);draw()});
    };
    draw();
  };
  show();
}

/* PDF 자동 입력 */
const PJ='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfReady,P=[];
function loadPdfJs(){
  return pdfReady=pdfReady||new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=PJ+'pdf.min.js';
    s.onload=async()=>{
      try{
        const w=await (await fetch(PJ+'pdf.worker.min.js')).text();
        pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));
      }catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=PJ+'pdf.worker.min.js'}
      res(pdfjsLib);
    };
    s.onerror=()=>{pdfReady=null;rej(new Error('lib'))};
    document.head.appendChild(s);
  });
}
async function pdfLines(file){
  const lib=await loadPdfJs();
  const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent(),rows=[];
    tc.items.forEach(it=>{
      if(!it.str.trim())return;
      const x=it.transform[4],y=it.transform[5];
      let r=rows.find(r=>Math.abs(r.y-y)<4);
      if(!r)rows.push(r={y,a:[]});
      r.a.push({x,s:it.str});
    });
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.a.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()));
  }
  return out;
}
const HEAD=/^(english|word|words|sentence|sentences|단어|영어|문장|뜻|해석|번호|no\.?)$/i;
const kindOf=en=>(en.split(/\s+/).length>=3||/[.!?]["')]?$/.test(en))?'sentences':'words';
function parseRows(lines){
  const rows=[];
  lines.forEach(raw=>{
    if(raw.split(/\s+/).every(t=>HEAD.test(t)))return;
    const l=raw.replace(/^\d+\s*[.)]\s*/,'');
    const m=l.search(/[가-힣ㄱ-ㅎ]/);
    const en=(m<0?l:l.slice(0,m)).replace(/[|:\-–—\s]+$/,'').trim();
    const ko=m<0?'':l.slice(m).replace(/^[|:\s]+/,'').trim();
    const last=rows[rows.length-1];
    if(!en&&!ko)return;
    if(!en){if(last)last.ko=(last.ko+' '+ko).trim();return}
    if(!ko){if(last&&!last.ko)last.en+=' '+en;else rows.push({en,ko:''});return}
    if(last&&last.ko&&/^[a-z]/.test(en)&&last.en.split(/\s+/).length>=3&&!/[.!?]["')]?$/.test(last.en)){last.en+=' '+en;last.ko+=' '+ko;return}
    rows.push({en,ko});
  });
  return rows;
}
function pvDraw(){
  $('#pv').innerHTML=`<p class="hint">${P.length}줄을 찾았습니다. 확인하고 고친 뒤 등록하세요.</p>`+
    P.map((r,i)=>`<div class="pr"><select data-k="${i}"><option value="words" ${r.k==='words'?'selected':''}>단어</option><option value="sentences" ${r.k==='sentences'?'selected':''}>문장</option></select><input data-en="${i}" value="${esc(r.en)}" placeholder="영어"><input data-ko="${i}" value="${esc(r.ko)}" placeholder="뜻"><button class="btn" data-x="${i}">삭제</button></div>`).join('')+
    '<button class="btn main" id="reg">목록에 등록</button>';
}
$('#pdf').onchange=async e=>{
  const f=e.target.files[0],pv=$('#pv');if(!f)return;
  pv.innerHTML='<p class="hint">PDF를 읽는 중…</p>';
  try{
    const lines=await pdfLines(f);
    if(!lines.length){pv.innerHTML='<p class="hint no">글자를 찾지 못했습니다. 스캔본이나 이미지로 된 PDF는 이 버전에서 읽을 수 없습니다.</p>';return}
    P=parseRows(lines).map(r=>({...r,k:kindOf(r.en)}));
    if(!P.length){pv.innerHTML='<p class="hint no">영어와 한글이 짝을 이룬 줄을 찾지 못했습니다. 표 형태를 확인해 주세요.</p>';return}
    pvDraw();
  }catch(err){
    pv.innerHTML='<p class="hint no">'+(err.message==='lib'?'PDF 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.':'PDF를 읽지 못했습니다. 다른 파일로 다시 시도해 주세요.')+'</p>';
  }
};
$('#pv').addEventListener('input',e=>{const d=e.target.dataset;if(d.en!==undefined)P[d.en].en=e.target.value;if(d.ko!==undefined)P[d.ko].ko=e.target.value});
$('#pv').addEventListener('change',e=>{const d=e.target.dataset;if(d.k!==undefined)P[d.k].k=e.target.value});
$('#pv').addEventListener('click',e=>{
  const d=e.target.dataset;
  if(d.x!==undefined){P.splice(+d.x,1);pvDraw()}
  if(e.target.id==='reg'){
    let n=0,skip=0,dup=0;
    P.forEach(r=>{
      const en=r.en.trim(),ko=r.ko.trim();
      if(!en||!ko){skip++;return}
      if(T[r.k].some(x=>x.en.toLowerCase()===en.toLowerCase())){dup++;return}
      T[r.k].push({en,ko});n++;
    });
    tView();P=[];$('#pv').innerHTML='';$('#pdf').value='';
    $('#saveMsg').textContent=`${n}개 등록 (비어서 건너뜀 ${skip}, 중복 ${dup}). 아래 [저장하기]를 눌러야 학생 화면에 반영됩니다.`;
    ok();
  }
});

/* 백업 */
$('#exp').onclick=()=>{
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`english-cards-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(T,null,2)],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  $('#saveMsg').textContent=`내보냈습니다: 단어 ${T.words.length}개, 문장 ${T.sentences.length}개 (${name})`;
};
$('#imp').onchange=async e=>{
  const f=e.target.files[0],msg=$('#saveMsg');if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(!Array.isArray(j.words)&&!Array.isArray(j.sentences))throw 0;
    let n=0,dup=0,bad=0;
    ['words','sentences'].forEach(k=>(Array.isArray(j[k])?j[k]:[]).forEach(x=>{
      const en=x&&typeof x.en==='string'?x.en.trim():'',ko=x&&typeof x.ko==='string'?x.ko.trim():'';
      if(!en||!ko){bad++;return}
      if(T[k].some(y=>y.en.toLowerCase()===en.toLowerCase())){dup++;return}
      T[k].push({en,ko});n++;
    }));
    tView();ok();
    msg.textContent=`${n}개 불러왔습니다 (중복 ${dup}, 형식 오류 ${bad}). 아래 [저장하기]를 눌러야 학생 화면에 반영됩니다.`;
  }catch(err){bad();msg.textContent='이 앱에서 내보낸 JSON 파일이 아닙니다. 파일을 다시 확인해 주세요.'}
  e.target.value='';
};

tView();tab(0);
</script>
